spring.application.name=property-management

# Allow H2 database to be accessed via browser van via Java application

spring.h2.console.enabled=true
# database server path
spring.h2.console.path=/h2-console

# db url and db name
spring.datasource.url=jdbc:h2:file:~/h2/propertydb
# db username
spring.datasource.username=sa
# db password
spring.datasource.password=

#db driver
spring.datasource.driver-class-name=org.h2.Driver

# tells to keep existing data and table while server restart, other value is create where after server restarts
spring.jpa.hibernate.ddl-auto=update

# this enables printing of sql queries generated by hibernate in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
